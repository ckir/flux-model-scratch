# The EIO experiment: the MAIN protocol with a constant for whether a lost lease fences writes.
# Question: with FIX_REMOTE_LEASE_SPEC off, which accepted window survives on each platform?

scenarios = ["eio"]

[[run]]
name = "eio-fenced-witness-SingleWriter"
module = "LockProtocol"
config = "configs/eio-fenced-witness-SingleWriter.cfg"
scenario = "eio"
kind = "witness"
violated = ["SingleWriter"]
constants = { Owners = ["o1"], Recoverers = ["r1"], PlainRuns = [], Cleanups = [], Breakers = ["b1"], MaxObjs = 5, MaxCrashes = 1, HostCrashes = false, MaxLeaseExpiries = 1, Platform = "posix", IdentityStrength = "strong", LockCapability = "remote", SEED_RECOVER_FOREIGN = false, SEED_RECOVER_UNCERTAIN = false, SEED_DEAD_AS_BUSY = false, SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = false, SEED_ACQUIRER_UNLINKS_BY_NAME = false, SEED_RESTART_RELEASES = false, SEED_MOVE_ASIDE_FOR_UNCERTAIN = false, SEED_RENAME_OVER_TAKEOVER = false, SEED_NO_CAPABILITY_GATE = false, SEED_TORN_AS_FOREIGN = false, LEASE_FENCES_WRITES = true }
timeout_minutes = 60

[[run]]
name = "eio-unfenced-witness-SingleWriter"
module = "LockProtocol"
config = "configs/eio-unfenced-witness-SingleWriter.cfg"
scenario = "eio"
kind = "witness"
violated = ["SingleWriter"]
constants = { Owners = ["o1"], Recoverers = ["r1"], PlainRuns = [], Cleanups = [], Breakers = ["b1"], MaxObjs = 5, MaxCrashes = 1, HostCrashes = false, MaxLeaseExpiries = 1, Platform = "posix", IdentityStrength = "strong", LockCapability = "remote", SEED_RECOVER_FOREIGN = false, SEED_RECOVER_UNCERTAIN = false, SEED_DEAD_AS_BUSY = false, SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = false, SEED_ACQUIRER_UNLINKS_BY_NAME = false, SEED_RESTART_RELEASES = false, SEED_MOVE_ASIDE_FOR_UNCERTAIN = false, SEED_RENAME_OVER_TAKEOVER = false, SEED_NO_CAPABILITY_GATE = false, SEED_TORN_AS_FOREIGN = false, LEASE_FENCES_WRITES = false }
timeout_minutes = 60
