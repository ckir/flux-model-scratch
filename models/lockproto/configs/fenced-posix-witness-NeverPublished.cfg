\* Fenced prototype (2026-09-16), NOT the V16 protocol: see Fenced.tla. An Owner and a Breaker under
\* LockCapability = remote, with one crash and one lease expiry - the setting in which LockProtocol.tla
\* needs three accepted windows and a fix flag. No fix flag here: the properties are about the destination.
\* Witness: a publication happens at all, so the two destination properties are not vacuous.
SPECIFICATION Spec
CONSTANTS
    Owners = {o1}
    Recoverers = {}
    PlainRuns = {}
    Cleanups = {}
    Breakers = {b1}
    NoProc = nobody
    P = dir
    LockName = lock
    DirLockName = dirlock
    TargetName = target
    MaxObjs = 5
    MaxCrashes = 1
    HostCrashes = FALSE
    MaxLeaseExpiries = 1
    Platform = "posix"
    IdentityStrength = "strong"
    LockCapability = "remote"
    SEED_RECOVER_FOREIGN = FALSE
    SEED_RECOVER_UNCERTAIN = FALSE
    SEED_DEAD_AS_BUSY = FALSE
    SEED_RECOVER_UNCERTAIN_CLEANUP_LOCK = FALSE
    SEED_ACQUIRER_UNLINKS_BY_NAME = FALSE
    SEED_RESTART_RELEASES = FALSE
    SEED_MOVE_ASIDE_FOR_UNCERTAIN = FALSE
    SEED_RENAME_OVER_TAKEOVER = FALSE
    SEED_NO_CAPABILITY_GATE = FALSE
    SEED_TORN_AS_FOREIGN = FALSE
    FIX_REMOTE_LEASE_SPEC = FALSE
    defaultInitValue = defaultInitValue
INVARIANT
    NeverPublished
