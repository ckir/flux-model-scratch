name: Fenced prototype

# Throwaway scratch repository: runs the fenced-publication prototype's model check on every push, so the
# experiment can be iterated without touching ckir/flux. The real model and its gate live there.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fenced:
    name: Fenced prototype (posix)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run the prototype's model check
        run: python models/lockproto/run.py --expected models/lockproto/expected-fenced.toml --scenario fenced --platform posix
      - name: Upload TLC output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlc-output-fenced-posix
          path: target/tla/out/
